project:
  type: book
  output-dir: docs

book:
  title: "Sách OHDSI (The Book of OHDSI)"
  subtitle: "Khoa học Dữ liệu Y tế Quan sát và Tin học Y sinh Mạng lưới"
  author:
    - name: "Cộng đồng OHDSI Việt Nam & OHDSI Global"
      affiliation: "Observational Health Data Sciences and Informatics (OHDSI)"
    - name: "Phan Thanh-Phuc, PhD (Chủ biên bản dịch tiếng Việt)"
      affiliation: "Bệnh viện Đại học Y Dược TP. Hồ Chí Minh (UMC HCMC), Việt Nam"
      email: "phanthahphuc@ohdsi.org"
  repo-url: https://github.com/OHDSI-VIETNAM/the-book-of-ohdsi-vi
  repo-branch: main
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  search: true
  sidebar:
    style: "docked"
    search: true
    collapse-level: 1
  page-footer:
    left: "Sách OHDSI — Ấn bản Tiếng Việt (The Book of OHDSI)"
    center: "Cộng đồng OHDSI Việt Nam (OHDSI Vietnam Chapter) · Giấy phép CC0 1.0"
    right: "Xây dựng với Quarto"

  chapters:
    - index.qmd
    - part: "Phần I — Cộng đồng OHDSI"
      chapters:
        - 01_community.qmd
        - 02_where_to_begin.qmd
        - 03_open_science.qmd
    - part: "Phần II — Biểu diễn Dữ liệu Thống nhất"
      chapters:
        - 04_cdm.qmd
        - 05_vocabularies.qmd
        - 06_etl.qmd
    - part: "Phần III — Phân tích Dữ liệu"
      chapters:
        - 07_use_cases.qmd
        - 08_tools.qmd
        - 09_sql_and_r.qmd
        - 10_cohort_definitions.qmd
        - 11_characterization.qmd
        - 12_population_level_estimation.qmd
        - 13_patient_level_prediction.qmd
    - part: "Phần IV — Chất lượng Bằng chứng"
      chapters:
        - 14_data_quality.qmd
        - 15_clinical_validity.qmd
        - 16_software_validity.qmd
        - 17_method_validity.qmd
    - part: "Phần V — Nghiên cứu trong Mạng lưới OHDSI"
      chapters:
        - 18_study_steps.qmd
        - 19_network_studies.qmd
    - part: "Phần VI — Phụ lục & Tài liệu tham khảo"
      chapters:
        - 20_glossary.qmd
        - 21_cohort_definitions_appendix.qmd
        - 22_negative_controls.qmd
        - 23_protocol_template.qmd
        - 24_hints.qmd
        - 25_references_and_index.qmd

