format:
  html:
    lang: vi
    theme:
      light: cosmo
      dark: darkly
    css: custom.css
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "Nội dung trong chương"
    toc-expand: 2
    smooth-scroll: true
    number-sections: false
    html-math-method: katex
    code-copy: true
    code-overflow: wrap
    code-tools: false
    link-external-icon: true
    link-external-newwindow: true
